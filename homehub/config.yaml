name: HomeHub
version: "1.1.0"
slug: homehub
description: Family dashboard (shopping, chores, calendar, expenses, notes and more) for the people in your home
url: https://github.com/thathimbo/Homehub-HA
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
# Opens from the Home Assistant sidebar; Home Assistant handles sign-in
ingress: true
ingress_port: 5000
panel_icon: mdi:home-heart
panel_title: HomeHub
# Reads people (person.*) and Home Assistant's location, time zone and units
homeassistant_api: true
# Off by default. Give it a port to open HomeHub without Home Assistant (set direct_access_password then)
ports:
  5000/tcp: null
ports_description:
  5000/tcp: Direct web access (not needed for the sidebar panel)
map:
  - type: share
    read_only: false
  - type: media
    read_only: false
  # To install the HomeHub integration (Assist, to-do lists, calendar) into custom_components
  - type: homeassistant_config
    read_only: false
watchdog: http://[HOST]:[PORT:5000]/healthz
options:
  instance_name: ""
  language: en
  use_home_assistant_people: true
  who_is_home_from_home_assistant: true
  exclude_people: []
  extra_household_members: []
  admin_name: Administrator
  admin_password: ""
  direct_access_password: ""
  time_format: 12h
  date_format: us
  calendar_start_day: sunday
  install_ha_integration: true
  api_key: ""
  weather: true
  weather_units: auto
  weather_view: compact
  max_upload_mb: 1024
  primary_color: "#1d4ed8"
  features:
    shopping_list: true
    media_downloader: true
    pdf_compressor: true
    qr_generator: true
    notes: true
    shared_cloud: true
    who_is_home: true
    personal_status: true
    chores: true
    recipes: true
    expiry_tracker: true
    url_shortener: false
    expense_tracker: true
    calendar: true
  reminder_categories:
    - key: health
      label: Health
      color: "#dc2626"
    - key: bills
      label: Bills
      color: "#0d9488"
    - key: school
      label: School
      color: "#7c3aed"
    - key: family
      label: Family
      color: "#2563eb"
schema:
  instance_name: str?
  language: list(en|hi|tr|zh)
  use_home_assistant_people: bool
  who_is_home_from_home_assistant: bool
  exclude_people:
    - str
  extra_household_members:
    - str
  admin_name: str
  admin_password: password?
  direct_access_password: password?
  time_format: list(12h|24h)
  date_format: list(us|iso|eu)
  install_ha_integration: bool
  api_key: password?
  calendar_start_day: list(sunday|monday|tuesday|wednesday|thursday|friday|saturday)
  weather: bool
  weather_units: list(auto|metric|imperial)
  weather_view: list(compact|detailed)
  max_upload_mb: int(0,)
  primary_color: match(^#[0-9a-fA-F]{6}$)
  features:
    shopping_list: bool
    media_downloader: bool
    pdf_compressor: bool
    qr_generator: bool
    notes: bool
    shared_cloud: bool
    who_is_home: bool
    personal_status: bool
    chores: bool
    recipes: bool
    expiry_tracker: bool
    url_shortener: bool
    expense_tracker: bool
    calendar: bool
  reminder_categories:
    - key: str
      label: str
      color: match(^#[0-9a-fA-F]{6}$)
