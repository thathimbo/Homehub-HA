name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: homehub/src/requirements*.txt

      - name: Install dependencies
        working-directory: homehub/src
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: homehub/src
        run: python -m pytest
